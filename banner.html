<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banner Neon Futurista Deslizante</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        background: transparent; /* Fondo transparente para el stream */
        overflow: hidden; /* Oculta el texto que está fuera de la pantalla */
        display: flex; /* Para centrar verticalmente si se usara sin marquee */
        justify-content: center;
        align-items: center; /* Centrar verticalmente, aunque el marquee lo anula */
        height: 100%; /* Ajusta esto en OBS para el tamaño del banner, ej. 100px */
        width: 100%; /* El ancho completo para el desplazamiento */
        position: relative; /* Necesario para el posicionamiento del texto */
    }

    .marquee-container {
        width: 100%;
        height: 100%; /* Para que el texto ocupe toda la altura del browser source */
        display: flex;
        align-items: center; /* Centra el texto verticalmente dentro del contenedor */
        position: absolute; /* Posicionamiento absoluto para el desplazamiento */
        white-space: nowrap; /* Evita que el texto se rompa en varias líneas */
        overflow: hidden; /* Oculta el texto fuera del contenedor */
    }

    .marquee-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 55px; /* Ajusta el tamaño según necesites */
        color: #FFFFFF; /* Color base del texto (blanco) para que el brillo neón lo defina */
        text-transform: uppercase;
        letter-spacing: 3px;
        line-height: 1; /* Elimina espacio extra de línea */
        
        /* Animaciones */
        animation: scroll-left 30s linear infinite, /* Desplazamiento lento (30s) */
                   flicker 2.5s infinite alternate,
                   glitch 3s infinite alternate; /* Animación glitch */
        
        /* Efecto Neón (más fucsia y más brillante) */
        text-shadow:
            0 0 8px #fff,          /* Brillo interior más blanco */
            0 0 15px #ff00ff,      /* Fucsia brillante (base) */
            0 0 25px #ff00ff,      /* Más fucsia */
            0 0 40px #FF00FF,      /* Fucsia más intenso */
            0 0 60px #7a00ff,      /* Púrpura/azul violeta */
            0 0 80px #00f0ff;      /* Cian para un contraste futurista */
    }

    /* Animación de desplazamiento (más lenta) */
    @keyframes scroll-left {
        0% { transform: translateX(100%); } /* Empieza fuera por la derecha */
        100% { transform: translateX(-100%); } /* Termina fuera por la izquierda */
    }

    /* Flicker de brillo */
    @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
            opacity: 1;
            text-shadow:
                0 0 8px #fff,
                0 0 15px #ff00ff,
                0 0 25px #ff00ff,
                0 0 40px #FF00FF,
                0 0 60px #7a00ff,
                0 0 80px #00f0ff;
        }
        20%, 24%, 55% {
            opacity: 0.7; /* Menos opacidad */
            text-shadow:
                0 0 4px #fff,
                0 0 8px #ff00ff,
                0 0 12px #7a00ff; /* Sombra reducida */
        }
    }

    /* Glitch tipo fallo (sin cambios importantes, ya que funcionaba bien) */
    @keyframes glitch {
        0% { transform: none; }
        2% { transform: skew(10deg); }
        4% { transform: skew(-10deg) translateX(-5px); }
        6% { transform: skew(5deg) translateX(5px); }
        8% { transform: none; }
        60% { transform: none; }
        62% { transform: skew(-5deg) translateX(-3px); }
        64% { transform: skew(5deg) translateX(3px); }
        66% { transform: none; }
        100% { transform: none; }
    }
</style>
</head>
<body>
    <div class="marquee-container">
        <h1 class="marquee-text">
            Sígueme para más R3tro Liv3s !! &nbsp;&nbsp;&nbsp; Sígueme para más R3tro Liv3s !! &nbsp;&nbsp;&nbsp;
            Sígueme para más R3tro Liv3s !! &nbsp;&nbsp;&nbsp; Sígueme para más R3tro Liv3s !! &nbsp;&nbsp;&nbsp;
        </h1>
    </div>
</body>
</html>
